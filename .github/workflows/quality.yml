name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # headroom so a cold-cache day fails loudly on real errors, not the ceiling

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install pinned packages
        run: bash scripts/ci-install.sh

      - name: Check formatting
        run: npm run format:check

      - name: Validate template
        run: bash scripts/verify.sh

      - name: Verify pinned packages against npm
        run: node scripts/verify-package-integrity.mjs --online
