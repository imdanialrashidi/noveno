name: quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Main runs serialize: a Pages deploy must finish before the next one
  # starts. PR runs cancel superseded pushes as before.
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # headroom so a cold-cache day fails loudly on real errors, not the ceiling
    # Project-canonical timezone: Jalali Nowruz-boundary tests construct
    # Tehran-local times (see tests/site-data.test.mjs); UTC hosts shift
    # March 20 23:59 into March 21 Tehran time and fail them spuriously.
    env:
      TZ: Asia/Tehran
      # The canonical origin is noveno.ir (custom domain on GitHub Pages);
      # PUBLIC_APP_URL would otherwise be empty on the runner.
      PUBLIC_APP_URL: https://noveno.ir
      # Public build-time values only. Set them as repository Actions
      # variables; unset values keep the honest "not configured" fallback.
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.PUBLIC_WEB3FORMS_ACCESS_KEY }}
      PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: bash scripts/ci-install.sh

      - name: Check formatting
        run: npm run format:check

      - name: Run verification gate
        run: bash scripts/verify.sh

      # GitHub Pages serves static files only. Cloudflare's _headers and
      # _redirects are dead weight there (and would be downloadable config),
      # so they never enter the Pages artifact. The 404 route preserves
      # legacy /insights links client-side instead.
      - name: Prepare GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: rm -f dist/_headers dist/_redirects

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
